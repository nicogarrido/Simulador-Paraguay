project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "taller/*.qmd"
    - "taller/casos/*.qmd"
    - "taller/internacional/*.qmd"
  resources:
    - simulador/**
    - presentaciones/**
    - "hojas/*.qmd"

website:
  title: "Simulador MIP Paraguay"
  description: "Material de formación del simulador de impacto insumo-producto"
  site-url: "https://nicogarrido.github.io/Simulador-Paraguay"
  favicon: recursos/favicon.svg
  reader-mode: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: "#2C3E50"
    foreground: "#FFFFFF"
    left:
      - href: index.qmd
        text: Inicio
      - href: taller/index.qmd
        text: Taller
      - href: hojas/index.qmd
        text: Las hojas
    right:
      - icon: github
        href: https://github.com/nicogarrido/Simulador-Paraguay
        aria-label: Repositorio
  sidebar:
    style: floating
    background: light
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Inicio
      - section: "Taller"
        href: taller/index.qmd
        contents:
          - taller/seccion-1-estructura.qmd
          - section: "Sección 2 · Cambios en la demanda"
            href: taller/seccion-2-cambios-demanda.qmd
            contents:
              - taller/casos/caso-1-soja-o-industria.qmd
              - taller/casos/caso-2-sequia-hidrovia.qmd
              - taller/casos/caso-3-planta-agroindustrial.qmd
              - taller/casos/caso-4-empleo-y-genero.qmd
              - taller/casos/caso-5-calificacion.qmd
              - taller/casos/caso-6-recesion-socio.qmd
              - taller/casos/caso-7-empleo-decente.qmd
          - section: "Sección 3 · El bloque externo"
            href: taller/seccion-3-bloque-externo.qmd
            contents:
              - taller/internacional/caso-ue-mercosur.qmd
              - taller/internacional/caso-corredor-bioceanico.qmd
          - taller/seccion-4-tu-caso.qmd
      - section: "Las hojas del simulador"
        href: hojas/index.qmd
        contents:
          - hojas/modos-de-uso.qmd
          - section: "Entradas"
            contents:
              - hojas/estimulos-nacionales.qmd
              - hojas/estimulos-internacionales.qmd
          - section: "Resultados"
            contents:
              - hojas/resumen-ejecutivo.qmd
              - hojas/produccion.qmd
              - hojas/pib.qmd
              - hojas/empleo.qmd
              - hojas/ingreso-laboral.qmd
          - section: "Análisis estructural"
            contents:
              - hojas/encadenamientos-internos.qmd
              - hojas/empleo-exportador.qmd
              - hojas/insercion-internacional.qmd
          - section: "Datos"
            contents:
              - hojas/matrices-nacionales.qmd
              - hojas/agregacion-sectorial.qmd
              - hojas/informacion-empleo.qmd
              - hojas/mrio.qmd
              - hojas/exportaciones.qmd
              - hojas/parametros.qmd
          - section: "Referencia"
            contents:
              - hojas/buenas-practicas.qmd
              - hojas/anexos.qmd
              - hojas/glosario.qmd
              - hojas/presentaciones.qmd
  page-footer:
    background: "#2C3E50"
    left: "Simulador de impacto insumo-producto · Paraguay"
    right: "Material bajo licencia CC BY 4.0"

format:
  html:
    theme:
      - cosmo
      - estilos.scss
    toc: true
    toc-title: "En esta página"
    toc-depth: 3
    smooth-scroll: true
    code-copy: true
    link-external-newwindow: true
    lang: es

lang: es
